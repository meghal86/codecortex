name: "CodeCortex PR Impact Review"
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write # Required to post comments on PRs

jobs:
  analyze-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to retrieve the complete git history for git diff
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build CodeCortex Analyzer
        run: npm ci && npm run build
        working-directory: ./codecortex-cli
        
      - name: Analyze Project Graph
        # This builds the CodeCortex knowledge graph natively inside the CI runner
        run: node ./codecortex-cli/dist/cli/index.js analyze
        
      - name: Detect Changes and Calculate Blast Radius
        id: detect
        run: |
          # Evaluate blast radius mapping the git diff against the intelligence graph
          echo "REPORT<<EOF" >> $GITHUB_ENV
          node ./codecortex-cli/dist/cli/index.js detect-impact --base ${{ github.event.pull_request.base.sha }} >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT;
            
            // Search for existing bot comment to update it (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body.includes('CodeCortex Impact Analysis'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
